<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | NOVARA</title><link rel="stylesheet" href="style.css"><style>
.admin-wrap{max-width:1100px;margin:30px auto;padding:0 18px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.admin-panel{background:#f3f0e9;padding:22px;margin:20px 0}.admin-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.admin-form label{font-size:11px;letter-spacing:1px}.admin-form input,.admin-form select,.admin-form textarea{display:block;width:100%;padding:12px;border:1px solid #ddd;margin-top:6px}.admin-form .wide{grid-column:1/-1}.admin-table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}.admin-table th,.admin-table td{padding:12px;border-bottom:1px solid #ddd;text-align:left}.admin-table img{width:48px;height:58px;object-fit:cover}.admin-table button{margin:2px}.admin-tabs{display:flex;gap:10px;flex-wrap:wrap}.admin-tabs button{padding:11px 16px;border:1px solid #111;background:#fff}.admin-tabs button.active{background:#111;color:#fff}.admin-status{padding:12px;background:#fff;border-left:3px solid #c5a46d;margin:12px 0}.danger{background:#7b1e1e!important;color:#fff!important;border-color:#7b1e1e!important}.admin-hidden{display:none!important}@media(max-width:650px){.admin-form{grid-template-columns:1fr}.admin-form .wide{grid-column:auto}.table-scroll{overflow-x:auto}.admin-table{min-width:700px}}
</style></head><body><div class="announcement">NOVARA · STORE MANAGEMENT</div><header class="header"><a class="logo" href="index.html">NOVA<span>RA</span></a><a href="index.html">View store ↗</a></header>
<main class="admin-wrap"><div class="admin-top"><div><div class="eyebrow">PRIVATE STORE AREA</div><h1 style="font-size:38px">NOVARA Admin</h1></div><button id="logoutBtn" class="btn admin-hidden">Log out</button></div><div id="message" class="admin-status">Connect your Supabase project to enable store management.</div>
<section id="loginPanel" class="admin-panel"><h2>Admin login</h2><form id="loginForm" class="admin-form"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><div class="wide"><button class="btn gold" type="submit">Log in</button></div></form></section>
<section id="dashboard" class="admin-hidden"><div class="admin-tabs"><button class="active" data-tab="products">Products</button><button data-tab="orders">Orders</button></div>
<div id="productsTab" class="admin-panel"><div class="admin-top"><h2>Products</h2><button id="newProduct" class="btn gold">Add product</button></div><form id="productForm" class="admin-form admin-hidden"><input type="hidden" name="id"><label>Product name<input name="name" required></label><label>Category<select name="category"><option>T-Shirts</option><option>Pants</option></select></label><label>Price (Rs.)<input name="price" type="number" min="0" required></label><label>Old price (optional)<input name="old_price" type="number" min="0" value="0"></label><label>Colour<input name="color" required></label><label>Stock quantity<input name="stock" type="number" min="0" value="0" required></label><label>Tag<input name="tag" value="DROP 01"></label><label>Sizes (comma separated)<input name="sizes" value="S,M,L,XL"></label><label class="wide">Image URL<input name="image_url" type="url" placeholder="https://..." required></label><label class="wide">Description<textarea name="description" rows="3"></textarea></label><div class="wide"><button class="btn gold" type="submit">Save product</button> <button id="cancelProduct" type="button" class="btn">Cancel</button></div></form><div class="table-scroll"><table class="admin-table"><thead><tr><th>Image</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody id="productsRows"></tbody></table></div></div>
<div id="ordersTab" class="admin-panel admin-hidden"><div class="admin-top"><h2>Customer orders</h2><button id="refreshOrders" class="btn">Refresh</button></div><div class="table-scroll"><table class="admin-table"><thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Items</th><th>Total</th><th>Status</th><th>Update</th></tr></thead><tbody id="ordersRows"></tbody></table></div></div>
</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
